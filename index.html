<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f1">
  <title>روشن | سفارش بسته</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17241f;
      --muted: #64716b;
      --paper: #f4f7f1;
      --line: #dce5dc;
      --green: #15734c;
      --green-dark: #10583a;
      --lime: #d9ef8a;
      --coral: #e56c52;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#cbd8cc 0.7px, transparent 0.7px);
      background-size: 19px 19px;
      font-family: "Vazirmatn", "Noto Sans Arabic", Tahoma, sans-serif;
    }

    .page {
      width: min(100% - 40px, 920px);
      min-height: 100vh;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 19px;
      font-weight: 800;
    }

    .brand-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--lime);
      border-radius: 11px 11px 11px 3px;
      font-size: 20px;
      line-height: 1;
    }

    .network {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .network::before {
      width: 8px;
      height: 8px;
      content: "";
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 4px #15734c1c;
    }

    main {
      flex: 1;
      display: grid;
      align-content: center;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 56px;
      padding-block: 70px;
    }

    .copy { align-self: center; }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.35;
      font-weight: 850;
    }

    .intro {
      max-width: 440px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }

    .action {
      align-self: center;
      padding: 22px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--coral);
      background: #fff;
      box-shadow: 0 16px 38px #213b2d12;
    }

    .action-label {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--green);
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    button:hover { background: var(--green-dark); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .arrow { font-size: 20px; line-height: 1; }

    .response {
      min-height: 28px;
      margin: 14px 0 0;
      color: var(--green-dark);
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      padding-block: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 32px, 480px); }
      header { height: 70px; }
      main {
        grid-template-columns: 1fr;
        gap: 34px;
        align-content: center;
        padding-block: 54px;
      }
      h1 { font-size: 43px; }
      .intro { font-size: 15px; }
      .action { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">ر</span><span>روشن</span></div>
      <span class="network">آماده</span>
    </header>

    <main>
      <section class="copy" aria-labelledby="page-title">
        <p class="eyebrow">خدمات روشن</p>
        <h1 id="page-title">اپلیکیشن سفارش بسته</h1>
        <p class="intro">آماده برای توسعه!</p>
      </section>

      <section class="action" aria-label="آزمایش دکمه">
        <p class="action-label">روشن / Roshan</p>
        <button id="test-button" type="button">
          <span>دکمه تست</span>
          <span class="arrow" aria-hidden="true">←</span>
        </button>
        <p class="response" id="response" aria-live="polite"></p>
      </section>
    </main>

    <footer>روشن <span aria-hidden="true">·</span> نسخه آزمایشی</footer>
  </div>

  <script>
    const testButton = document.querySelector("#test-button");
    const response = document.querySelector("#response");

    testButton.addEventListener("click", () => {
      response.textContent = "درخواست آزمایشی ثبت شد.";
    });
  </script>
</body>
</html>
